<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <button id="btn" style="padding: 20px; width: 100%;">CLICK TO CHECK QUEUE</button>

    <script>
        const webapp = window.Telegram.WebApp;
        webapp.ready();

        document.getElementById('btn').onclick = function() {
            // Using the raw Telegram method
            webapp.sendData("/queue");
        };
    </script>
</body>
</html>

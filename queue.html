<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position dans la file d'attente</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script src='https://libtl.com/sdk.js' data-zone='10996173' data-sdk='show_10996173'></script>

    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f4f9; color: #333; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #0088cc; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-size: 18px; padding: 0 20px; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Actualisation de votre position...</h2>
    <p>Veuillez patienter pendant le chargement.</p>

    <script>
        const webapp = window.Telegram.WebApp;
        webapp.ready();

        // 🟢 AUTO-TRIGGER ON LOAD 🟢
        window.onload = function() {
            // Check if Monetag is ready
            if (typeof show_10996173 === 'function') {
                show_10996173().then(() => {
                    // This runs AFTER the ad is closed
                    // It sends "/queue" to the bot automatically
                    webapp.sendData("/queue"); 
                    webapp.close(); // Closes the webview and returns to the chat
                }).catch((err) => {
                    // Fallback if the ad fails to load
                    console.error("Ad failed:", err);
                    webapp.sendData("/queue");
                    webapp.close();
                });
            } else {
                // Fallback if SDK isn't present
                webapp.sendData("/queue");
                webapp.close();
            }
        };
    </script>
</body>
</html>
